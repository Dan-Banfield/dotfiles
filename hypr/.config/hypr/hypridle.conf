# Lock before any system suspend, including closing the laptop lid.
# Lid actions stay controlled by systemd-logind.
general {
    lock_cmd = pidof hyprlock || hyprlock --grace 0
    before_sleep_cmd = loginctl lock-session

    # Wait for the compositor's lock notification before allowing sleep.
    inhibit_sleep = 3

    # Honour application, systemd, and Wayland idle inhibitors.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
}

listener {
    timeout = 60
    on-timeout = systemctl suspend
    ignore_inhibit = false
}
