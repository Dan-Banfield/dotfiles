# Optional Lock action for the session menu; install the hyprlock package.
general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    path = ~/.local/share/wallpapers/default.jpeg
    color = rgb(0d1423)
    blur_passes = 2
    blur_size = 7
    brightness = 0.55
}

label {
    monitor =
    text = $TIME12
    color = rgb(b9d5f4)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(c1d5f0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 64
    outline_thickness = 2
    outer_color = rgb(8aade0)
    inner_color = rgb(101c30)
    font_color = rgb(c1d5f0)
    check_color = rgb(b9d5f4)
    fail_color = rgb(f2b5c2)
    placeholder_text = Password
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    rounding = 18
    position = 0, -105
    halign = center
    valign = center
}
