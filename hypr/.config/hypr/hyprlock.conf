# Blue Night lock screen: the same navy and blue palette as Walker and Waybar.
# Hyprlock 0.9.6+. Authentication uses the package's normal PAM configuration.
$font = JetBrainsMono Nerd Font
$text = rgb(c1d5f0)
$muted = rgb(8395af)
$blue = rgb(517fc4) rgb(8aade0) rgb(b9d5f4) 45deg

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = false
}

animations {
    enabled = true
    bezier = softIn, 0.16, 1.0, 0.30, 1.0
    bezier = softOut, 0.40, 0.0, 1.0, 1.0
    animation = fadeIn, 1, 3, softIn
    animation = fadeOut, 1, 2, softOut
    animation = inputFieldColors, 1, 2, softIn
    animation = inputFieldDots, 1, 1, softIn
    animation = inputFieldWidth, 1, 2, softIn
}

background {
    monitor =
    path = ~/.local/share/wallpapers/default.jpeg
    color = rgb(0d1423)
    blur_passes = 2
    blur_size = 6
    brightness = 0.65
    contrast = 0.95
    noise = 0
    vibrancy = 0.10
    zindex = -1
}

# Central card. Shapes sit behind the text and password field.
shape {
    monitor =
    size = 480, 420
    color = rgba(0d1423dd)
    rounding = 32
    border_size = 1
    border_color = rgba(517fc466) rgba(8aade088) rgba(b9d5f466) 45deg
    shadow_passes = 2
    shadow_size = 18
    shadow_color = rgba(00000066)
    shadow_boost = 1.0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# Small lock badge above the clock.
shape {
    monitor =
    size = 132, 28
    color = rgba(203758cc)
    rounding = 14
    border_size = 0
    position = 0, 164
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text =   LOCKED
    color = rgb(b9d5f4)
    font_size = 9
    font_family = $font
    position = 0, 164
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = <b>$TIME12</b>
    color = $text
    font_size = 58
    font_family = $font
    position = 0, 88
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $muted
    font_size = 13
    font_family = $font
    position = 0, 20
    halign = center
    valign = center
    zindex = 2
}

shape {
    monitor =
    size = 48, 2
    color = rgba(8aade099)
    rounding = 1
    border_size = 0
    position = 0, -14
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $USER
    color = rgb(b9d5f4)
    font_size = 14
    font_family = $font
    position = 0, -48
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 352, 56
    outline_thickness = 2
    outer_color = $blue
    inner_color = rgb(101c30)
    font_color = $text
    check_color = rgb(8aade0) rgb(b9d5f4) 45deg
    fail_color = rgb(f2b5c2) rgb(d58b9e) 45deg
    capslock_color = rgb(eed6a4)
    placeholder_text = Password
    check_text = Checking…
    fail_text = $FAIL
    font_family = $font
    dots_size = 0.22
    dots_spacing = 0.30
    dots_center = true
    fade_on_empty = false
    rounding = 28
    position = 0, -112
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = Enter to unlock
    color = $muted
    font_size = 10
    font_family = $font
    position = 0, -174
    halign = center
    valign = center
    zindex = 2
}
